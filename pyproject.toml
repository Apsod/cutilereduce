[project]
name = "cutilereduce"
version = "0.1.0"
description = "An experimental CUDA Tile generator for monoidal fold kernels"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.0",
    "ninja>=1.13.0",
    "polars>=1.42.0",
    "torch",
    "cuda-tile[tileiras]==1.8.1",
    "cuda-toolkit[tileiras,nvvm,nvcc]<13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.57",
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
